name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,maps]"
      - run: ruff check .
      - run: black --check .
      - run: mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install --yes libegl1 libgl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,maps]"
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python scripts/verify_wheel.py dist/*.whl
      - name: Verify source distribution exclusions
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '/(config|ui/legacy|__pycache__|build|dist|log|output)/'; then
            echo "Source distribution contains a forbidden path"
            exit 1
          fi
