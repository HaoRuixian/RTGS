station:
  station_id: NBFH
  receiver_position:
    latitude_deg: 29.788157
    longitude_deg: 121.455481
    height_m: 19.303
    x_m: -2890959.0587
    y_m: 4725854.8085
    z_m: 3150024.8212
  antenna_height: 8.836
  monument_height: 0.8
  environment_type: coastal
  reflector_surface_type: sea
input:
  constellations: []
  signals: []
  exclude_constellations: []
  exclude_signals: []
  sampling_interval: 30
processing:
  min_elevation_deg: 5
  max_elevation_deg: 30
  live_arc_window_minutes: 30
  live_analysis_interval_seconds: 300
  elevation_rate_mode: monotonic
  min_arc_length: 300
  max_time_gap_seconds: 90
  detrend_method: polynomial_sin_elevation
  detrend_order: 2
  smoothing_method: none
  smoothing_window: 5
  outlier_method: mad
  outlier_threshold: 3.5
ir:
  estimation_mode: ekf
  wavelength_source: built_in
  wavelength_overrides_m: {}
  frequency_search_mode: reflector_height
  min_reflector_height: 2.836
  max_reflector_height: 12.836
  explicit_frequency_min: null
  explicit_frequency_max: null
  frequency_grid_size: 2048
  lomb_scargle:
    samples_per_peak: 8
    oversampling_factor: 4
    normalize: power
    floating_mean: true
  peak_selection:
    max_candidates: 1
    min_prominence: 0.05
    min_width_bins: 1
    prefer_high_power: true
  harmonic_check: true
  use_rising_arcs: true
  use_setting_arcs: true
  ekf:
    q_rh: 5.0e-05
    q_amplitude: 6.0e-05
    measurement_variance: 1.3055
    initial_rh_m: 8
    initial_rh_variance: 1
    local_state_variance: 1
    init_min_samples: 12
    init_max_samples: 600
    rh_init_min_height_m: 3
    rh_init_max_height_m: 9
    rh_init_min_samples: 30
    rh_init_max_arcs: 8
    rh_init_max_samples_per_arc: 300
    output_interval_seconds: 60
    output_window_seconds: 60
    min_active_arcs: 1
    max_time_gap_seconds: 22.5
geometry:
  use_external_az_el: true
  compute_az_el_if_missing: false
  reflection_zones:
  - name: zone_1
    min_elevation_deg: 5
    max_elevation_deg: 30
    azimuth_windows:
    - - 180
      - 220
  - name: zone_2
    min_elevation_deg: 5
    max_elevation_deg: 30
    azimuth_windows:
    - - 90
      - 180
qc:
  min_peak_to_noise_ratio: 10
  min_primary_peak_ratio: 1.25
  min_arc_duration: 120
  min_snr_amplitude: 1
  max_gap_ratio: 0.2
  reject_cycle_slip_suspects: false
  reject_multipath_outliers: true
  cycle_slip_phase_jump_cycles: 8
products:
  enable_reflector_height: true
  enable_sea_level: true
  enable_snow_depth: false
  sea_level_reference: 8.785
  enable_dynamic_sea_level_correction: true
  dynamic_sea_level_window_hours: 3
  dynamic_sea_level_min_points: 6
  dynamic_sea_level_max_iterations: 12
  dynamic_sea_level_tolerance: 0.0001
  dynamic_sea_level_igg3_k0: 0.5
  dynamic_sea_level_igg3_k1: 2
  dynamic_sea_level_min_weight: 1.0e-12
  dynamic_sea_level_regularization: 1.0e-12
  dynamic_sea_level_normalize_design: true
  snow_depth_reference_height: null
output:
  output_dir: output/reflectometry
  file_format:
  - csv
  - json
  save_intermediate: true
  save_arc_level_results: true
  save_spectrum: true
  save_qc_flags: true
logging:
  level: INFO
  console: false
  rotating_file: false
  log_dir: log/reflectometry
  max_bytes: 2000000
  backup_count: 5
