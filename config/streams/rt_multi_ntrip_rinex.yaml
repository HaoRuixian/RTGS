# Multi-station RT NTRIP -> RINEX configuration
#
# Run with:
#   python3 utils/rt_ntrip_to_rinex.py config/streams/rt_multi_ntrip_rinex.yaml
#
# Relative output paths are resolved against this YAML file.

defaults:
  enabled: true
  ntrip:
    port: 2101
    user_agent: NTRIP RTGS RTRINEX/0.1
    connect_timeout_seconds: 15
    reconnect_delay_seconds: 5
  rinex:
    output_directory: /mnt/20t/RT_RINEX
    sample_interval_seconds: auto
    split_enabled: true
    split_period_seconds: 3600
    daily_merge_min_interval_seconds: 15
    country_code: CHN
    datatype: MO
    receiver_type: UNKNOWN
    antenna_type: UNKNOWN
    antenna_model: ""
    marker_number: "0"
    time_system: GPS
    auto_detect_obs_types: true
    align_tolerance_seconds: 0.001

stations:
  - name: BUAA01
    ntrip:
      host: 8.140.235.117
      mountpoint: BUAA01
      user: adminHRX
      password: hao20030801
    rinex:
      marker_name: BUAA01
      station_code: BUAA
      receiver_number: "01"
      receiver_type: Unicorecomm UM982
      antenna_model: HXCCGX611A
