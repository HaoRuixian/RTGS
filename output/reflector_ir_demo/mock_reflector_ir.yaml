station:
  station_id: "DEMO"
  receiver_position:
    latitude_deg: 31.2304
    longitude_deg: 121.4737
    height_m: 12.5
  antenna_height: 2.35
  monument_height: 0.80
  environment_type: "coastal"
  reflector_surface_type: "sea"

input:
  source_type: "mock"
  source_path:
  cache_endpoint:
  constellations: ["G", "E"]
  signals: ["1C", "5Q"]
  time_window:
    start: "2026-03-19T00:00:00"
    end: "2026-03-19T04:00:00"
  sampling_interval: 30.0
  source_options:
    arc_count: 6
    reflector_height_m: 4.2
    noise_std_db: 0.45
    amplitude_db: 2.6

processing:
  min_elevation_deg: 5.0
  max_elevation_deg: 28.0
  elevation_rate_mode: "monotonic"
  min_arc_length: 300.0
  min_samples_per_arc: 40
  max_time_gap_seconds: 90.0
  detrend_method: "polynomial_sin_elevation"
  detrend_order: 2
  smoothing_method: "moving_average"
  smoothing_window: 5
  outlier_method: "mad"
  outlier_threshold: 3.5

ir:
  wavelength_source: "built_in"
  wavelength_overrides_m: {}
  frequency_search_mode: "reflector_height"
  min_reflector_height: 0.5
  max_reflector_height: 8.0
  explicit_frequency_min:
  explicit_frequency_max:
  frequency_grid_size: 2048
  lomb_scargle:
    samples_per_peak: 8
    oversampling_factor: 4.0
    normalize: "power"
    floating_mean: true
  peak_selection:
    max_candidates: 5
    min_prominence: 0.05
    min_width_bins: 1.0
    prefer_high_power: true
  harmonic_check: true
  use_rising_arcs: true
  use_setting_arcs: true

geometry:
  use_external_az_el: true
  compute_az_el_if_missing: false
  elevation_correction: 0.0
  azimuth_mask:
    - [0.0, 360.0]
  reflector_azimuth_sector:
    - [150.0, 330.0]

qc:
  min_peak_to_noise_ratio: 3.0
  min_arc_duration: 300.0
  min_snr_amplitude: 1.0
  max_gap_ratio: 0.2
  reject_cycle_slip_suspects: true
  reject_multipath_outliers: true
  cycle_slip_phase_jump_cycles: 8.0

products:
  enable_reflector_height: true
  enable_sea_level: true
  enable_snow_depth: true
  sea_level_reference: 6.8
  snow_depth_reference_height: 4.8

output:
  output_dir: "output/reflector_ir_demo"
  file_format: ["csv", "json"]
  save_intermediate: true
  save_arc_level_results: true
  save_spectrum: true
  save_qc_flags: true

logging:
  level: "INFO"
  console: true
  rotating_file: true
  log_dir: "log/reflector_ir"
  max_bytes: 2000000
  backup_count: 5
