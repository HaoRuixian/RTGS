station:
  station_id: BRST00FRA0
  receiver_position:
    latitude_deg: 48.380491
    longitude_deg: -4.496598
    height_m: 65.794
    x_m: 4231162.779
    y_m: -332746.923
    z_m: 4745130.681
  antenna_height: 21.0
  monument_height: 0.8
  environment_type: coastal
  reflector_surface_type: sea
input:
  constellations: []
  signals: []
  exclude_constellations: []
  exclude_signals: []
  sampling_interval: 30.0
processing:
  min_elevation_deg: 5.0
  max_elevation_deg: 25.0
  live_arc_window_minutes: 30
  live_analysis_interval_seconds: 60
  elevation_rate_mode: monotonic
  min_arc_length: 300.0
  max_time_gap_seconds: 90.0
  detrend_method: polynomial_sin_elevation
  detrend_order: 2
  smoothing_method: none
  smoothing_window: 5
  outlier_method: mad
  outlier_threshold: 3.5
ir:
  estimation_mode: ekf
  wavelength_source: built_in
  wavelength_overrides_m: {}
  frequency_search_mode: reflector_height
  min_reflector_height: 13.0
  max_reflector_height: 20.5
  explicit_frequency_min: null
  explicit_frequency_max: null
  frequency_grid_size: 2048
  lomb_scargle:
    samples_per_peak: 8
    oversampling_factor: 4.0
    normalize: power
    floating_mean: true
  peak_selection:
    max_candidates: 1
    min_prominence: 0.05
    min_width_bins: 1.0
    prefer_high_power: true
  harmonic_check: true
  use_rising_arcs: true
  use_setting_arcs: true
  ekf:
    q_rh: 5.0e-5
    q_amplitude: 6.0e-5
    measurement_variance: 2.0
    initial_rh_m: 16.7
    initial_rh_variance: 1.0
    local_state_variance: 1.0
    init_min_samples: 60
    init_max_samples: 600
    rh_init_min_height_m: 13.0
    rh_init_max_height_m: 20.5
    rh_init_min_samples: 240
    rh_init_min_arcs: 4
    rh_init_max_arcs: 8
    rh_init_max_samples_per_arc: 600
    output_interval_seconds: 60
    output_window_seconds: 120
    min_active_arcs: 1
    max_time_gap_seconds: 90.0
geometry:
  use_external_az_el: true
  compute_az_el_if_missing: false
  reflection_zones:
  - name: primary_reflector
    min_elevation_deg: 11.98
    max_elevation_deg: 25.0
    azimuth_windows:
    - - 165.0
      - 330.0
  - name: zone_2
    min_elevation_deg: 5.0
    max_elevation_deg: 20.0
    azimuth_windows:
    - - 130.0
      - 165.0
qc:
  min_peak_to_noise_ratio: 10.0
  min_primary_peak_ratio: 1.25
  min_arc_duration: 120.0
  min_snr_amplitude: 1.0
  max_gap_ratio: 0.2
  reject_cycle_slip_suspects: false
  reject_multipath_outliers: true
  cycle_slip_phase_jump_cycles: 8.0
products:
  enable_reflector_height: true
  enable_sea_level: true
  enable_snow_depth: false
  sea_level_reference: 21.0
  enable_dynamic_sea_level_correction: true
  dynamic_sea_level_window_hours: 4.0
  dynamic_sea_level_min_points: 6
  dynamic_sea_level_max_iterations: 12
  dynamic_sea_level_tolerance: 0.0001
  dynamic_sea_level_igg3_k0: 0.5
  dynamic_sea_level_igg3_k1: 2.0
  dynamic_sea_level_min_weight: 1.0e-12
  dynamic_sea_level_regularization: 1.0e-12
  dynamic_sea_level_normalize_design: true
  snow_depth_reference_height: null
output:
  output_dir: output/reflectometry
  file_format:
  - csv
  - json
  save_intermediate: true
  save_arc_level_results: true
  save_spectrum: true
  save_qc_flags: true
logging:
  level: INFO
  console: false
  rotating_file: false
  log_dir: log/reflectometry
  max_bytes: 2000000
  backup_count: 5
