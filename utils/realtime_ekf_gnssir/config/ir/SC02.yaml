station:
  station_id: SC02_RTCM3P3
  receiver_position:
    latitude_deg: 48.546253
    longitude_deg: -123.007637
    height_m: -9.224
    x_m: -2304502.5391
    y_m: -3547587.465
    z_m: 4757297.2854
  antenna_height: 6.904
  monument_height: 0.8
  environment_type: coastal
  reflector_surface_type: sea

input:
  constellations: []
  signals: []
  exclude_constellations: []
  exclude_signals:
    - 1W
    - 2W
  sampling_interval: 15

processing:
  live_arc_window_minutes: 30
  live_analysis_interval_seconds: 300
  elevation_rate_mode: monotonic
  min_arc_length: 300
  max_time_gap_seconds: 22.5
  detrend_method: polynomial_sin_elevation
  detrend_order: 2
  smoothing_method: none
  smoothing_window: 5
  outlier_method: mad
  outlier_threshold: 3.5

geometry:
  use_external_az_el: true
  compute_az_el_if_missing: false
  reflection_zones:
    - name: primary_reflector
      min_elevation_deg: 3
      max_elevation_deg: 13
      azimuth_windows:
        - [50, 230]

ir:
  estimation_mode: ekf
  wavelength_source: built_in
  wavelength_overrides_m: {}
  frequency_search_mode: reflector_height
  min_reflector_height: 3
  max_reflector_height: 9
  frequency_grid_size: 2048
  harmonic_check: true
  use_rising_arcs: true
  use_setting_arcs: true
  ekf:
    q_rh: 2.0e-6
    q_varphi: 0
    q_amplitude: 6.0e-5
    q_phase: 0
    measurement_variance: 0.17049
    robust_measurement_update: false
    initial_rh_m: 5.0
    initial_rh_variance: 1.0
    local_state_variance: 1.0
    init_min_samples: 20
    init_max_samples: 600
    rh_init_min_height_m: 4
    rh_init_max_height_m: 6
    rh_init_min_samples: 20
    rh_init_min_arcs: 3
    rh_init_max_arcs: 8
    rh_init_max_samples_per_arc: 600
    rh_init_cycles: 2.0
    rh_init_average: mean
    rh_search_step_m: 0.025
    phase_center_offsets_m: []
    output_interval_seconds: 300
    output_window_seconds: 300
    min_active_arcs: 1
    max_time_gap_seconds: 22.5

qc:
  min_peak_to_noise_ratio: 2
  min_primary_peak_ratio: 1.25
  min_arc_duration: 300
  min_snr_amplitude: 1.0
  max_gap_ratio: 0.2
  reject_cycle_slip_suspects: false
  reject_multipath_outliers: true
  cycle_slip_phase_jump_cycles: 8.0

products:
  enable_reflector_height: true
  enable_sea_level: true
  sea_level_reference: 6.7871
  enable_dynamic_sea_level_correction: true
  dynamic_sea_level_window_hours: 4
  dynamic_sea_level_min_points: 6
  dynamic_sea_level_max_iterations: 12
  dynamic_sea_level_tolerance: 0.0001
  dynamic_sea_level_igg3_k0: 0.5
  dynamic_sea_level_igg3_k1: 2.0
  dynamic_sea_level_min_weight: 1.0e-12
  dynamic_sea_level_regularization: 1.0e-12
  dynamic_sea_level_normalize_design: true

output:
  output_dir: output/reflectometry
  file_format:
    - csv
    - json
  save_intermediate: true
  save_arc_level_results: true
  save_spectrum: true
  save_qc_flags: true

logging:
  level: INFO
  console: false
  rotating_file: false
  log_dir: log/reflectometry
  max_bytes: 2000000
  backup_count: 5
